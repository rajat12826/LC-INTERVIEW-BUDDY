# .github/workflows/daily-download-ts.yml
name: Daily Download (TypeScript)
on:
  schedule:
    # Runs daily at 10:30 PM UTC, which is 4:00 AM IST the next day
    - cron: '30 22 * * *'
  workflow_dispatch: # Allows manual triggering

jobs:
  update-daily-question:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install tsx for TypeScript execution
        run: npm install -g tsx

      - name: Run download.ts to get daily question
        env:
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY }}
        run: npx tsx src/utils/download.ts

      - name: Commit and Push changes
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add src/lib/questions.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: Update daily LeetCode question via TS and AI"
            git push
          fi
